name: Update Wiki (Emoji List & Keywords)

permissions:
  contents: write

on:
  push:
    branches:
      - "main"
    paths:
      - "emoji/**"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout wiki repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            fonts-noto-color-emoji \
            libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 \
            libcairo2-dev

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install meme_generator==0.1.14 filetype pillow pycairo
          pip install "pydantic<2.0"

      - name: Configure meme_generator
        run: |
          mkdir -p ~/.config/meme_generator
          echo -e "[meme]\nload_builtin_memes = false\nmeme_dirs = [\"$GITHUB_WORKSPACE/emoji\"]" > ~/.config/meme_generator/config.toml

      - name: Generate emoji list
        run: |
          python3 wiki/scripts/update_meme_list.py

      - name: Generate keywords
        run: |
          python3 wiki/scripts/meme_keywords.py
          if [ -f "docs/meme_keywords.md" ]; then
            mv docs/meme_keywords.md wiki/emoji_keywords.md
          fi

      - name: Commit and push to Wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emoji_list.md emoji_keywords.md images thumbs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update emoji list and keywords"
            git push origin master
          fi
