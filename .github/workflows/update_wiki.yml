name: Update Wiki (Emoji List & Keywords)

permissions:
  contents: write

on:
  push:
    branches:
      - "main"
    paths:
      - "emoji/**"
  workflow_dispatch:

# 同一时间只允许一个更新任务，避免两次自动提交互相冲突
concurrency:
  group: update-wiki
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout wiki repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            fonts-noto-color-emoji \
            libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 \
            libcairo2-dev

      - name: Install meme-generator fonts
        # 预览图渲染依赖上游字体，缺字体时中文会变成方块（乱码）。
        # 字体清单取自 MemeCrafters/meme-generator 的 resources/fonts，
        # 运行时通过 GitHub API 动态获取，失败则回退到内置清单。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          REPO = "MemeCrafters/meme-generator"
          SUBDIR = "resources/fonts"
          RAW = f"https://raw.githubusercontent.com/{REPO}/main/{SUBDIR}/"
          API = f"https://api.github.com/repos/{REPO}/contents/{SUBDIR}"

          FALLBACK = [
              "Aller_Bd.ttf",
              "FZKATJW.ttf",
              "FZSEJW.ttf",
              "FZSJ-QINGCRJ.ttf",
              "FZXS14.ttf",
              "GlowSansSC-Normal-Heavy.otf",
              "HiraginoMin-W5-90-RKSJ-H-2.ttc",
              "Neo Sans Bold.ttf",
              "NotoSansSC-Bold.ttf",
              "NotoSansSC-Regular.ttf",
              "NotoSerifSC-Bold.otf",
              "NotoSerifSC-Regular.otf",
              "RoGSanSrfStd-Bd.otf",
              "consola.ttf",
              "上首方糖体.ttf",
              "庞门正道粗书体.ttf",
          ]

          headers = {"User-Agent": "meme-emoji-ci"}
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          try:
              req = urllib.request.Request(API, headers=headers)
              items = json.load(urllib.request.urlopen(req, timeout=30))
              names = [it["name"] for it in items if it.get("type") == "file"]
              print(f"字体清单来自 GitHub API：{len(names)} 个")
          except Exception as exc:
              print(f"API 获取失败（{exc}），回退到内置清单")
              names = FALLBACK

          dest = pathlib.Path("/tmp/mgfonts")
          dest.mkdir(parents=True, exist_ok=True)

          failed = []
          for name in names:
              url = RAW + urllib.parse.quote(name)
              for attempt in range(1, 4):
                  try:
                      data = urllib.request.urlopen(url, timeout=120).read()
                      (dest / name).write_bytes(data)
                      print(f"  ok   {name}  {len(data) // 1024} KiB")
                      break
                  except Exception as exc:
                      if attempt == 3:
                          failed.append(name)
                          print(f"  FAIL {name}: {exc}")
                      else:
                          print(f"  retry {name} ({attempt}/3)")
                          time.sleep(2)

          if failed:
              raise SystemExit(f"字体下载失败：{failed}")
          PY
          sudo mkdir -p /usr/share/fonts/meme
          sudo cp /tmp/mgfonts/* /usr/share/fonts/meme/
          sudo fc-cache -fv
          echo "--- 已安装字体数：$(fc-list | wc -l) ---"
          fc-list :lang=zh | head -5

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install meme_generator==0.1.14 filetype pillow pycairo
          pip install "pydantic<2.0"

      - name: Replace preview placeholder avatar
        # 预览图的缺省头像取自 meme_generator 内置的
        # resources/images/emojis/*.png（utils.random_image 随机挑选），
        # 这里把它们统一覆盖为仓库内的 docs/picture/head.png，
        # 使所有表情预览使用同一张头像。
        run: |
          PLACEHOLDER_DIR="$(python3 -c 'import pathlib, meme_generator; print(pathlib.Path(meme_generator.__file__).parent / "resources" / "images" / "emojis")')"
          echo "placeholder dir: ${PLACEHOLDER_DIR}"
          ls "${PLACEHOLDER_DIR}"
          count=$(ls "${PLACEHOLDER_DIR}"/*.png | wc -l)
          for f in "${PLACEHOLDER_DIR}"/*.png; do
            cp docs/picture/head.png "${f}"
          done
          echo "replaced ${count} placeholder avatar(s) with docs/picture/head.png"

      - name: Configure meme_generator
        run: |
          mkdir -p ~/.config/meme_generator
          echo -e "[meme]\nload_builtin_memes = false\nmeme_dirs = [\"$GITHUB_WORKSPACE/emoji\"]" > ~/.config/meme_generator/config.toml

      - name: Generate emoji list
        # --force：忽略已有预览图，全部按当前代码重建
        run: |
          python3 wiki/scripts/update_meme_list.py --force

      - name: Generate keywords
        run: |
          python3 wiki/scripts/meme_keywords.py
          if [ -f "docs/meme_keywords.md" ]; then
            mv docs/meme_keywords.md wiki/emoji_keywords.md
          fi

      - name: Commit and push to Wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emoji_list.md emoji_keywords.md images thumbs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🤖 Auto-update emoji list and keywords"
          # Wiki 也可能被手工编辑过，先 rebase 再推送，避免 non-fast-forward
          git pull --rebase origin master
          git push origin master
